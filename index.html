<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaAPP</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">ClimaApp</h1>
            <form class="search-form" id="search-form">
                <input type=" text" placeholder="Buscar ciudad..." aria-label="Buscar ciudad" id="city">
                <input type="number" placeholder="Días (1 a 5)..." aria-label="Cantidad de días" id="dias" min="1" max="5" title="El pronóstico gratuito permite un máximo de 5 días">
                <button type="submit">Buscar</button>
                <button type="button" id="geo-btn" class="geo-btn" title="Usar mi ubicación">📍</button>
            </form>
            <button id="unit-toggle" class="unit-toggle" title="Cambiar unidad de temperatura">°C</button>
        </div>
    </header>

    <main>
        <div id="clima"></div>
    </main>
    <footer>

    </footer>
    

</body>

</html>
